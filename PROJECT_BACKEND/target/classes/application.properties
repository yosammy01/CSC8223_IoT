spring.application.name=JAVA_BACKEND
spring.docker.compose.enabled=false

# Database (PostgreSQL) — override with env vars in each environment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# MQTT (local broker by default)
app.mqtt.url=${APP_MQTT_URL:tcp://localhost:1883}
app.mqtt.client-id-prefix=${APP_MQTT_CLIENT_ID_PREFIX:${spring.application.name}-${random.value}}
app.mqtt.default-topic=${APP_MQTT_DEFAULT_TOPIC:java_backend/default}
app.mqtt.inbound-topic=${APP_MQTT_INBOUND_TOPIC:java_backend/#}
app.mqtt.qos=${APP_MQTT_QOS:1}
app.mqtt.username=${APP_MQTT_USERNAME:}
app.mqtt.password=${APP_MQTT_PASSWORD:}
app.mqtt.connect-publish.enabled=${APP_MQTT_CONNECT_PUBLISH_ENABLED:true}
app.mqtt.connect-publish.topic=${APP_MQTT_CONNECT_PUBLISH_TOPIC:${app.mqtt.default-topic}}
app.mqtt.connect-publish.payload=${APP_MQTT_CONNECT_PUBLISH_PAYLOAD:${spring.application.name} connected}
app.mqtt.connect-publish.qos=${APP_MQTT_CONNECT_PUBLISH_QOS:${app.mqtt.qos}}
app.mqtt.connect-publish.retained=${APP_MQTT_CONNECT_PUBLISH_RETAINED:false}
